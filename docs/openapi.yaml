  parameters:
    Language:
      name: Accept-Language
      in: header
      required: false
      schema:
        enum:
          - az
          - en
          - ru
        default: az
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: *a1
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: *a1
      description:
        User/operation/payload-bound durable key. Same key and payload MUST
        replay stored result after commit; do not create another reward.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
