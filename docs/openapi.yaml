        '204':
          description: Successful empty response
        '429':
          description: Rate limited; delta-seconds Retry-After
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description:
